[tool.poetry]
name = "agentctx"
version = "0.3.0"
description = "kubectx-like CLI for switching Codex auth profiles"
authors = ["Nikolay Baryshnikov <root@k0d.ru>"]
packages = [
    { include = "agentctx" },
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/18studio/agentctx"
repository = "https://github.com/18studio/agentctx"
keywords = ["codex", "cli", "profiles", "kubectx"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: Russian",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]

[tool.poetry.dependencies]
python = "^3.8"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[tool.poetry.scripts]
agentctx = "agentctx.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
